[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.141.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "passlib[argon2]>=1.7.4",
    "psycopg[binary]>=3.3.5",
    "pyjwt>=2.13.0",
    "sqlalchemy[asyncio]>=2.0",
    "sqlmodel>=0.0.22",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]
