services:
  postgres:
    image: postgres:16-alpine
    container_name: tris_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tris_user
      POSTGRES_PASSWORD: tris_password
      POSTGRES_DB: tris_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tris_user -d tris_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
